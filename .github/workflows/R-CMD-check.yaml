name: R CMD check
on:
  push:
    branches: [main, fix/capivara-science-baseline]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      R_KEEP_PKG_SOURCE: "yes"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
      - name: Install and compare source with installed namespace
        shell: Rscript {0}
        run: |
          lib <- tempfile("capivara-ci-library-")
          dir.create(lib)
          status <- system2(file.path(R.home("bin"), "R"), c("CMD", "INSTALL", paste0("--library=", shQuote(lib)), "."))
          stopifnot(status == 0)
          status <- system2(file.path(R.home("bin"), "Rscript"), c("tools/check_source_install.R", ".", shQuote(lib)))
          stopifnot(status == 0)
          # Exercise the installed user-facing tutorial, not a source-only script.
          demo <- system.file("tutorials", "run_prepared_cube.R", package = "capivara",
                              lib.loc = lib, mustWork = TRUE)
          out <- tempfile("capivara-tutorial-")
          Sys.setenv(R_LIBS = paste(c(lib, .libPaths()), collapse = .Platform$path.sep))
          status <- system2(file.path(R.home("bin"), "Rscript"),
                            shQuote(c(demo, "--demo", out, "8")))
          stopifnot(status == 0)
          expected <- c("segmentation.rds", "labels_native.rds", "regional_spectra.csv",
                        "regions.csv", "provenance.rds", "sessionInfo.txt", "segmentation.png")
          stopifnot(all(file.exists(file.path(out, expected))))
          labels <- readRDS(file.path(out, "labels_native.rds"))
          regions <- read.csv(file.path(out, "regions.csv"))
          spectra <- read.csv(file.path(out, "regional_spectra.csv"))
          provenance <- readRDS(file.path(out, "provenance.rds"))
          ids <- sort(unique(as.integer(labels$cluster_map[!is.na(labels$cluster_map)])))
          stopifnot(length(ids) >= 8L, identical(ids, sort(as.integer(regions$region))),
                    sum(regions$n_spaxels) == sum(!is.na(labels$cluster_map)),
                    setequal(ids, unique(spectra$region)),
                    all(is.na(spectra$fixed_aperture_sum) |
                        spectra$n_valid_spaxels == spectra$n_region_spaxels),
                    identical(provenance$physical_fits, "NOT_RUN"))
          # Validate the real exporter against the tutorial's products.
          exporter <- system.file("tutorials", "export_semantic_atlas.R",
                                  package = "capivara", lib.loc = lib, mustWork = TRUE)
          status <- system2(file.path(R.home("bin"), "Rscript"),
                            shQuote(c(exporter, out)))
          stopifnot(status == 0)
          atlas <- jsonlite::read_json(file.path(out, "atlas.json"),
                                      simplifyVector = FALSE)
          features <- read.csv(file.path(out, "region_features.csv"))
          edges <- read.csv(file.path(out, "region_adjacency.csv"))
          stopifnot(identical(atlas$schema, "capivara-semantic-atlas-v1"),
                    identical(atlas$source, "Synthetic demonstration"),
                    atlas$actual_k == length(ids),
                    setequal(features$region, ids),
                    sum(features$n_spaxels) == sum(!is.na(labels$cluster_map)),
                    all(edges$region_a < edges$region_b),
                    all(edges$shared_edges > 0),
                    all(is.na(edges$cosine_distance) |
                        (edges$cosine_distance >= 0 & edges$cosine_distance <= 2)))
