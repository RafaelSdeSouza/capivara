name: Build website preview
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.27
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::xml2
            any::knitr
            any::rmarkdown
            any::rsconnect
            local::.
          needs: website
      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site(new_process = FALSE)'
      - name: Build Atlas
        run: Rscript tools/build_atlas_site.R docs
      - name: Generate legacy redirects
        run: Rscript tools/write_website_redirects.R docs
      - name: Check internal links and anchors
        run: Rscript tools/check_website_links.R docs
      - name: Package preview for local browser
        uses: actions/upload-artifact@v4
        with:
          name: capivara-website-preview
          path: docs
          if-no-files-found: error
