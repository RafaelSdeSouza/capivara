name: Publish pkgdown site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install package and website dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::xml2
            any::knitr
            any::rmarkdown
            local::.
          needs: website

      - name: Check generated README parity
        run: |
          quarto render README.qmd --to gfm
          git diff --exit-code -- README.md README_files

      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site(new_process = FALSE)'

      - name: Generate legacy redirects
        run: Rscript tools/write_website_redirects.R docs

      - name: Check internal links and anchors
        run: Rscript tools/check_website_links.R docs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
