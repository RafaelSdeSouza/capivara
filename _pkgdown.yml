url: https://rafaelsdesouza.com.br/capivara/
destination: docs

template:
  bootstrap: 5
  light-switch: true
  bslib:
    bg: "#ffffff"
    fg: "#14233a"
    primary: "#245c96"
    secondary: "#607086"
    border-radius: "0.2rem"
    btn-border-radius: "0.2rem"
    link-color: "#245c96"
  includes:
    in_header: |
      <meta name="theme-color" content="#14233a">

home:
  title: Capivara | Spectral segmentation of IFS cubes
  description: >
    Spectral segmentation of integral-field spectroscopy cubes with explicit
    spatial support and flux-preserving regional spectra.
  sidebar:
    structure: [links, license, citation, authors, dev]

navbar:
  structure:
    left: [intro, articles, examples, reference, paper, github]
    right: [search, lightswitch]
  components:
    intro:
      text: Get started
      href: articles/getting-started.html
    articles:
      text: User guide
      menu:
      - text: Segmentation backends
        href: articles/choosing-segmentation-backend.html
      - text: Semantic representations
        href: articles/semantic-representations.html
      - text: Support masks
        href: articles/support-masks.html
      - text: Regional spectra
        href: articles/flux-preserving-products.html
      - text: FITS and DS9
        href: articles/fits-ds9-export.html
      - text: Kinematic analysis
        href: articles/kinematic-analysis.html
      - text: Bar model
        href: articles/bisymmetric-bar-model.html
      - text: Paper reproduction
        href: articles/reproducing-paper.html
    examples:
      text: Examples
      href: articles/examples.html
    reference:
      text: Functions
      href: reference/index.html
    paper:
      text: Paper
      href: https://doi.org/10.1093/mnras/staf688
    github:
      text: GitHub
      href: https://github.com/RafaelSdeSouza/capivara

articles:
- title: Start
  navbar: ~
  contents:
  - getting-started
- title: User guide
  navbar: ~
  contents:
  - choosing-segmentation-backend
  - semantic-representations
  - support-masks
  - flux-preserving-products
  - fits-ds9-export
  - kinematic-analysis
  - bisymmetric-bar-model
- title: Examples
  navbar: ~
  contents:
  - examples
  - reproducing-paper

reference:
- title: Core spectral segmentation
  desc: Exact and sparse-graph segmentation, component selection, and memory planning.
  contents:
  - segment
  - segment_large
  - choose_ncomp_by_snr
  - estimate_segment_memory
- title: Semantic representations
  desc: Explicit flux and shape meanings, preparation, diagnostics, and native coverage.
  contents:
  - capivara_representation
  - capivara_amplitude_functional
  - full_flux_representation
  - spectral_shape_representation
  - manga_sandra_spectral_shape
  - prepare_capivara_representation
  - spectral_shape_diagnostic
  - representation_coverage_qc
- title: Support construction
  desc: Foreground support builders used before assigning region labels.
  contents:
  - build_starlet_mask
  - build_adaptive_support
  - build_quality_support
  - build_capivara_support
- title: Flux-preserving spectra and reconstruction
  desc: Regional spectra and reconstructed cubes for downstream analysis.
  contents:
  - summarize_cluster_spectra
  - reconstruct_cluster_cube
  - reconstruct_flux_preserving_cube
- title: Segmentation plotting
  desc: Discrete region maps and regional spectral displays.
  contents:
  - plot_cluster
  - plot_cluster_spectra
- title: Kinematics
  desc: Native line maps, kinematic segmentation, model discovery, and reusable panels.
  contents:
  - segment_kinematics
  - run_kinematic_analysis
  - kinematic_models
  - kinematic_panels
- title: Bisymmetric modelling
  desc: Explicit modelling for galaxies with independent evidence of a bar.
  contents:
  - run_manga_bar_model
- title: Package
  contents:
  - capivara-package

footer:
  structure:
    left: developed_by
    right: built_with

development:
  mode: auto
